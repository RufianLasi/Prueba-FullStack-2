<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Store - Contacto</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Game Store</h1>
        <p>Tu tienda de videojuegos en Chile</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="productos.html">Productos</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="blogs.html">Blogs</a>
        <a href="contacto.html">Contacto</a>
        <a href="login.html">Iniciar Sesión</a>
        <a href="registro.html">Registrarse</a>
        <a href="admin-home.html">Panel Admin</a>
        <a href="carrito.html" class="cart-status">Carrito (<span class="cart-count">0</span>)</a>
    </nav>

    <main>
        <section>
            <h2>Contáctanos</h2>
            <p>¿Tienes dudas o consultas? Escríbenos y te responderemos a la brevedad.</p>
            
            <form id="formContacto" style="max-width: 500px; margin: 20px auto; text-align: left;">
                <div style="margin-bottom: 15px;">
                    <label for="nombre">Nombre Completo:</label><br>
                    <input type="text" id="nombre" name="nombre" required style="width: 100%; padding: 8px; margin-top: 5px;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label for="email">Correo Electrónico:</label><br>
                    <input type="email" id="email" name="email" required style="width: 100%; padding: 8px; margin-top: 5px;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label for="mensaje">Mensaje:</label><br>
                    <textarea id="mensaje" name="mensaje" rows="5" required style="width: 100%; padding: 8px; margin-top: 5px;"></textarea>
                </div>

                <button type="submit" class="btn-accion">Enviar Mensaje</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Game Store Chile | Todos los derechos reservados.</p>
    </footer>

    <script src="js/carrito.js"></script>
    <script src="js/validaciones.js"></script>
</body>
</html>
