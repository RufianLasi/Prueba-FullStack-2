<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Store - Nuevo Producto</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Registro de Nuevo Producto</h1>
    </header>

    <main class="admin-container">
        <aside class="admin-sidebar">
            <ul>
                <li><a href="admin-home.html"> Inicio Panel</a></li>
                <li><a href="admin-productos.html"> Gestión Productos</a></li>
            </ul>
        </aside>

        <section class="admin-content">
            <h2>Formulario de Alta de Producto</h2>
            <form id="formNuevoProducto" novalidate>
                <div class="form-group">
                    <label for="prodCodigo">Código del Producto:</label>
                    <input type="text" id="prodCodigo" placeholder="GME004">
                    <span id="errorProdCodigo" class="mensaje-error"></span>
                </div>

                <div class="form-group">
                    <label for="prodNombre">Nombre del Juego:</label>
                    <input type="text" id="prodNombre" placeholder="Super Mario Bros">
                    <span id="errorProdNombre" class="mensaje-error"></span>
                </div>

                <div class="form-group">
                    <label for="prodPrecio">Precio ($):</label>
                    <input type="number" id="prodPrecio" placeholder="39990">
                    <span id="errorProdPrecio" class="mensaje-error"></span>
                </div>

                <div class="form-group">
                    <label for="prodStock">Stock Inicial:</label>
                    <input type="number" id="prodStock" placeholder="10">
                    <span id="errorProdStock" class="mensaje-error"></span>
                </div>

                <div class="form-group">
                    <label for="prodStockCritico">Stock Crítico:</label>
                    <input type="number" id="prodStockCritico" value="3">
                </div>

                <button type="submit" class="btn-accion">Guardar Producto</button>
                <p id="mensajeAdminExito" class="mensaje-exito" style="margin-top:15px;"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Game Store Chile</p>
    </footer>

    <script src="js/admin.js"></script>
</body>
</html>
